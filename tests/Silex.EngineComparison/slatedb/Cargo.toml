[package]
name = "slatedb-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "SlateDB adapter for the Silex engine comparison harness (see ../README.md)"

[[bin]]
name = "slatedb-adapter"
path = "src/main.rs"

[dependencies]
# SlateDB 0.18.1, pinned. Default features (`aws`, `foyer`) are replaced by `foyer` alone: the
# adapter uses the local-filesystem object store and a Foyer block cache.
slatedb = { version = "=0.18.1", default-features = false, features = ["foyer"] }
# SlateDB's API is async; workers and its background tasks share one multi-threaded runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
debug = false

# Standalone crate: not part of any parent workspace.
[workspace]
