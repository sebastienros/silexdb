name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'README.md'

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Silex.Tool/Ui/package-lock.json

      - name: Build
        run: |
          dotnet build src/Silex/Silex.csproj --configuration Release -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          dotnet build src/Silex.Keys/Silex.Keys.csproj --configuration Release -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          dotnet build tests/Silex.Test/Silex.Test.csproj --configuration Release -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          dotnet build tests/Silex.Tool.Tests/Silex.Tool.Tests.csproj --configuration Release -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True

      - name: Test
        run: |
          npm test --prefix src/Silex.Tool/Ui
          dotnet test tests/Silex.Test/Silex.Test.csproj --configuration Release --no-build
          dotnet test tests/Silex.Tool.Tests/Silex.Tool.Tests.csproj --configuration Release --no-build

      - name: Pack and install native tool
        shell: bash
        run: |
          dotnet pack src/Silex.Tool/Silex.Tool.csproj -c Release -r "${{ matrix.rid }}" -o tool-artifacts -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          dotnet pack src/Silex.Tool/Silex.Tool.csproj -c Release -o tool-artifacts -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          RID="${{ matrix.rid }}"
          dotnet tool install Silex.Tool --tool-path tool-installed --add-source "$PWD/tool-artifacts" --arch "${RID##*-}" --version "1.0.0-preview-${{ github.run_number }}"

      - name: Test native tool
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export SILEX_TEST_EXECUTABLE="$PWD/tool-installed/silex.exe"
          else
            export SILEX_TEST_EXECUTABLE="$PWD/tool-installed/silex"
          fi
          dotnet test tests/Silex.Tool.Tests/Silex.Tool.Tests.csproj -c Release --no-build

      - name: Pack portable tool and pointer
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Silex.Tool/Silex.Tool.csproj -c Release -r any -p:PublishAot=false -o tool-artifacts -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True

      - name: Upload preview tool packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.rid }}
          path: tool-artifacts/*.nupkg

      - name: Pack preview packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Silex/Silex.csproj --output artifacts --configuration Release --no-build -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
          dotnet pack src/Silex.Keys/Silex.Keys.csproj --output artifacts --configuration Release --no-build -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True

      - name: Push preview packages to Feedz
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/silexdb/nuget/index.json --skip-duplicate
          done

  tool-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: tool-*
          path: artifacts
          merge-multiple: true
      - name: Push tool components before pointer
        shell: bash
        env:
          FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="1.0.0-preview-${{ github.run_number }}"
          for package in artifacts/*.nupkg; do
            if [[ "$package" != "artifacts/Silex.Tool.$VERSION.nupkg" ]]; then
              dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/silexdb/nuget/index.json --skip-duplicate
            fi
          done
          dotnet nuget push "artifacts/Silex.Tool.$VERSION.nupkg" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/silexdb/nuget/index.json --skip-duplicate

  jepsen:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Silex.Jepsen/Silex.Jepsen.csproj --configuration Release

      # Allow for startup, all profiles, checking and crash recovery on slower runners.
      - name: Jepsen smoke
        timeout-minutes: 3
        run: dotnet run --no-build -c Release --project tests/Silex.Jepsen -- all --seconds 1 --crash-cycles 2 --seed 7 --output jepsen-results

      - name: Upload failing histories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-results-${{ matrix.os }}
          path: jepsen-results
          if-no-files-found: ignore
