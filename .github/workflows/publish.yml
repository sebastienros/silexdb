name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  tool-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack native tool
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Silex.Tool/Silex.Tool.csproj -c Release -r "${{ matrix.rid }}" -o artifacts -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True
      - uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.rid }}
          path: artifacts/Silex.Tool.${{ matrix.rid }}.*.nupkg

  build:
    needs: tool-pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          dotnet test tests/Silex.Test/Silex.Test.csproj --configuration Release
          dotnet test tests/Silex.Tool.Tests/Silex.Tool.Tests.csproj --configuration Release
          npm test --prefix src/Silex.Tool/Ui

      - uses: actions/download-artifact@v4
        with:
          pattern: tool-*
          path: artifacts
          merge-multiple: true

      - name: Pack with dotnet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION"
          dotnet pack src/Silex/Silex.csproj --output artifacts --configuration Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True
          dotnet pack src/Silex.Keys/Silex.Keys.csproj --output artifacts --configuration Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True
          dotnet pack src/Silex.Tool/Silex.Tool.csproj --output artifacts --configuration Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True
          dotnet pack src/Silex.Tool/Silex.Tool.csproj --output artifacts --configuration Release -r any -p:PublishAot=false -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sebastienros

      - name: Push with dotnet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for package in artifacts/*.nupkg; do
            if [[ "$package" != "artifacts/Silex.Tool.$VERSION.nupkg" ]]; then
              dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          dotnet nuget push "artifacts/Silex.Tool.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
