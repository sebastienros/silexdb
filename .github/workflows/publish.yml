name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Silex.Test/Silex.Test.csproj --configuration Release

      - name: Pack with dotnet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION"
          dotnet pack src/Silex/Silex.csproj --output artifacts --configuration Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=True

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sebastienros

      - name: Push with dotnet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
